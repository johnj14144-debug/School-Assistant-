name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Fetch the Electron binary
        run: node apps/desktop/node_modules/electron/install.js
      - name: Smoke test (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @sa/desktop e2e
      - name: Smoke test
        if: runner.os != 'Linux'
        run: pnpm --filter @sa/desktop e2e
